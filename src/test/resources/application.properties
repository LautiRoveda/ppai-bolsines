# Configuracion de los TESTS: base H2 en memoria (modo PostgreSQL), para no necesitar PostgreSQL levantado.
spring.datasource.url=jdbc:h2:mem:bolsines;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
spring.jpa.open-in-view=false
logging.level.root=WARN
logging.level.bolsines=INFO
spring.main.banner-mode=off
