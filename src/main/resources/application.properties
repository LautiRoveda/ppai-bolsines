# =====================================================================
# PPAI Bolsines - Grupo 10 - Configuracion
# =====================================================================

# --- Base de datos PostgreSQL ---
# Si tu PostgreSQL usa otro usuario, clave o puerto, cambialo aca.
# La base "bolsines" tiene que existir (ver README).
spring.datasource.url=jdbc:postgresql://localhost:5432/bolsines
spring.datasource.username=postgres
spring.datasource.password=postgres

# --- Hibernate / JPA ---
# Las tablas NO las crea Hibernate: las crea db/schema.sql (ver InicializadorBaseDeDatos).
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
spring.jpa.open-in-view=false
# Muestra en la consola el SQL que genera Hibernate (true / false). Sirve para estudiar; en la demo, false.
spring.jpa.show-sql=false

# --- Servidor web ---
# http://localhost:8080  (solo escucha en esta maquina)
server.port=8080
server.address=localhost
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# --- Log: solo avisos de Spring y los mensajes propios (por ejemplo, el stub del CU 29) ---
logging.level.root=WARN
logging.level.bolsines=INFO
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{0} - %msg%n
spring.main.banner-mode=off
